[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "CODAvision"
version = "0.1.0"
description = "CODAvision is an open-source Python package designed for medical image labeling."
readme = "README.md"
license = {file = "LICENSE.txt" }

authors = [
    { name = "Valentina Matos-Romero", email = "vmatosr1@jh.edu" },
    { name = "Ashley Kiemen", email = "kiemen@jhmi.edu" }
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Recognition"
]

keywords = ["medical imaging", "image labeling", "machine learning", "deep learning", "tissue labeling"]

dependencies = [
    # Numerical computing (compatible with TensorFlow 2.10)
    "numpy>=1.26,<2.0",

    # Image processing
    "pillow==10.4.0",

    # Deep Learning - Platform-specific TensorFlow installation
    # Windows uses TensorFlow 2.10 (includes GPU support)
    "tensorflow==2.10.1; sys_platform == 'win32'",
    # Linux uses TensorFlow 2.21 with CUDA libraries
    "tensorflow[and-cuda]==2.21.0; sys_platform == 'linux'",
    # Apple Silicon macOS uses CPU-only TensorFlow 2.21
    "tensorflow==2.21.0; sys_platform == 'darwin'",

    "keras==2.10.0; sys_platform == 'win32'",
    "tf-keras==2.21.0; sys_platform == 'linux'",
    "tf-keras==2.21.0; sys_platform == 'darwin'",
    # 0.31 is the last release providing native Windows filesystem wheels.
    "tensorflow-io-gcs-filesystem<0.32; sys_platform == 'win32'",

    # PyTorch - Default deep learning framework
    # uv sources select CUDA 12.8 wheels on Linux/Windows and PyPI on macOS.
    # For CUDA GPU support with pip, install PyTorch first:
    #   pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cu128
    # Then: pip install -e .
    # Or use: python scripts/check_cuda_version.py for guided installation
    "torch==2.11.0",
    "torchvision==0.26.0",

    # PySide6 owns the GUI; share one cv2 provider with inference libraries.
    "opencv-python-headless==4.10.0.84",

    # Scientific computing and visualization
    "matplotlib==3.9.2",
    "scipy==1.13.1",
    "pandas==2.2.2",
    "seaborn==0.13.2",

    # Additional image processing
    "scikit-image==0.24.0",
    "tifffile>=2024.8.28",

    # Data handling
    "xmltodict==0.13.0",
    "openpyxl==3.1.2",

    # Whole Slide Imaging (cross-platform - works on Linux, macOS, Windows)
    "openslide-python",
    "openslide-bin",

    # Medical imaging formats
    "pydicom",

    # GUI framework
    "PySide6==6.5.1.1,<7",

    # Utilities
    "GPUtil==1.4.0",

    # Jupyter support
    "jupyter==1.1.1",
    "tornado==6.5",
    "jinja2==3.1.6",

    # PDF generation
    "fpdf==1.7.2",

    # Build tools
    #"pip==24.2",
    "attrs==24.2.0",
    "wheel==0.43.0",
    "setuptools==78.1.1",
    "packaging==24.1",
    "zipp==3.20.1",
    ]

requires-python = ">=3.10,<3.12"

[project.optional-dependencies]
# Development dependencies (includes all test and code quality tools)
# Install with: pip install -e ".[dev]"
dev = [
    # Testing framework
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.3.0",

    # GUI testing
    "pytest-qt>=4.2.0",
    "pytest-xvfb>=3.0.0; sys_platform == 'linux'",

    # Mocking and fixtures
    "pytest-mock>=3.11.0",
    "factory-boy>=3.3.0",
    "responses>=0.23.0",

    # Test utilities and coverage
    "coverage[toml]>=7.2.0",

    # Code quality tools
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "pylint>=2.17.0",
    "mypy>=1.4.0",

    # Additional testing tools
    "hypothesis>=6.82.0",
    "pytest-benchmark>=4.0.0",
    "freezegun>=1.2.2",
    "pypdf>=3.0.0",  # PDF validation in tests
]

# Minimal testing dependencies (for CI pipelines)
# Install with: pip install -e ".[test]"
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    "pytest-xvfb>=3.0.0; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/Kiemen-Lab/CODAvision"
Documentation = "https://github.com/Kiemen-Lab/CODAvision#readme"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
include = ["/CODAvision.py", "/base", "/gui"]

[tool.uv]
required-version = ">=0.10.10"
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64') and python_version == '3.10'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[project.scripts]
CODAvision = "CODAvision:main"
